[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Atlas Orein <gamesworldcraft@gamil.com>"]
repository = "https://github.com/atlas-orien/msrt-adapters"
readme = "README.md"

[workspace.dependencies]
msrt = { version = "0.1.8", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[workspace.lints.rust]
# missing_docs = "warn"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
