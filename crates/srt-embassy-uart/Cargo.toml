[package]
name = "srt-embassy-uart"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Embassy-friendly UART adapter boundary for the SRT protocol."

[features]
default = []
std = ["critical-section/std"]

[dependencies]
srt = { workspace = true }
srt-adapter-core = { path = "../srt-adapter-core", version = "0.1.0" }
embedded-io-async = { workspace = true }
critical-section = "1"

[dev-dependencies]
futures = { version = "0.3", default-features = true }

[lints]
workspace = true

[[example]]
name = "mcu_uart_link"
required-features = ["std"]
