[package]
name = "msrt-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/msrt-ffi"
readme = "README.md"
description = "C ABI bindings for MSRT."
keywords = ["msrt", "ffi", "c", "serial", "embedded"]
categories = ["api-bindings", "embedded", "no-std"]
include = [
    "Cargo.toml",
    "README.md",
    "include/**",
    "src/**",
    "examples/**",
]

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["std"]
std = ["msrt/std"]

[dependencies]
msrt.workspace = true

[lints]
workspace = true
