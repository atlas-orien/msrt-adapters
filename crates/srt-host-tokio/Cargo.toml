[package]
name = "srt-host-tokio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tokio host adapter for the SRT protocol."

[features]
default = []

[dependencies]
srt = { workspace = true }
srt-adapter-core = { path = "../srt-adapter-core", version = "0.1.0" }
tokio = { version = "1", features = ["io-util", "io-std", "net", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "net", "time"] }
tokio-serial = "5.4.5"

[lints]
workspace = true
