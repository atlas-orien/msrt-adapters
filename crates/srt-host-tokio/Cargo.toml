[package]
name = "msrt-host-tokio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tokio host adapter for the MSRT protocol."

[features]
default = ["std"]
std = ["msrt-adapter-core/std"]

[dependencies]
msrt-adapter-core = { workspace = true }
tokio = { version = "1", features = ["io-util", "io-std", "net", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "net", "time"] }
tokio-serial = "5.4.5"

[lints]
workspace = true
