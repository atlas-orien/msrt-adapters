[package]
name = "msrt-uart"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/msrt-uart"
readme = "README.md"
description = "UART adapters for MSRT."
keywords = ["msrt", "uart", "serial", "embedded", "tokio"]
categories = ["embedded", "no-std", "network-programming"]
include = [
    "Cargo.toml",
    "README.md",
    "src/**",
]

[features]
default = ["tokio"]
std = ["msrt/std"]
tokio = ["std", "dep:tokio"]

[dependencies]
msrt.workspace = true
tokio = { workspace = true, optional = true }

[lints]
workspace = true
